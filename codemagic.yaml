workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
    artifacts:
      - build/**/*.apk
      - android/app/build/outputs/apk/**/*.apk
      - dist/**/*
