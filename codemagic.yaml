workflows:
  android-release:
    name: Lovable Android APK Build
    max_build_duration: 120

    instance_type: mac_mini_m1

    environment:
      node: latest
      java: 17

    scripts:

      - name: Install dependencies
        script: |
          npm install

      - name: Build Lovable Web App
        script: |
          npm run build

      - name: Install Capacitor
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        script: |
          npx cap init "Voice Debt Pocket" "com.voice.debt.pocket" --web-dir=dist

      - name: Add Android
        script: |
          npx cap add android

      - name: Sync Android
        script: |
          npx cap sync android

      - name: Build Release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
